name: Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment: Production

    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          CF_DEPLOY_KEY: ${{ secrets.CF_DEPLOY_KEY }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$CF_DEPLOY_KEY" ]; then
            echo "::error::A required secret is empty - check secret names and the environment name"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "X-Deploy-Key: $CF_DEPLOY_KEY" \
            "$COOLIFY_WEBHOOK"
