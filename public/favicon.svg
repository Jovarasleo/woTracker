<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Active-tab icon: weight plate with a bright, glowing color rim -->
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#1a1b1e" />
  <g fill="none" stroke-width="9" transform="rotate(-90 32 32)" filter="url(#glow)">
    <circle cx="32" cy="32" r="23" stroke="#b197fc" pathLength="100" stroke-dasharray="23 77" />
    <circle cx="32" cy="32" r="23" stroke="#66d9e8" pathLength="100" stroke-dasharray="23 77" stroke-dashoffset="-25" />
    <circle cx="32" cy="32" r="23" stroke="#f783ac" pathLength="100" stroke-dasharray="23 77" stroke-dashoffset="-50" />
    <circle cx="32" cy="32" r="23" stroke="#ffa94d" pathLength="100" stroke-dasharray="23 77" stroke-dashoffset="-75" />
  </g>
  <circle cx="32" cy="32" r="13" fill="#2c2e33" />
  <circle cx="32" cy="32" r="5" fill="#1a1b1e" />
</svg>
