<svg
  width="32"
  height="32"
  viewBox="0 0 32 32"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Outer plate -->
  <circle cx="16" cy="16" r="15" fill="#575757" />
  <circle cx="16" cy="16" r="15" fill="none" stroke="#4e4e4e" stroke-width="2" />
    <!-- Inner ring -->
  <circle cx="16" cy="16" r="9" fill="#5f5f5f" />
  <circle cx="16" cy="16" r="9" fill="none" stroke="#3a3a3a" stroke-width="1" />

  <!-- Center hole -->
  <circle cx="16" cy="16" r="3" fill="#ffffff" />

  <!-- Raised radial bars (embossed effect) -->
  <g stroke-linecap="round">
    <!-- Top -->
    <line x1="16" y1="2" x2="16" y2="13" stroke="#ffffff" stroke-width="1" stroke-linecap="square"/>
    <!-- Bottom -->
    <line x1="16" y1="18" x2="16" y2="30" stroke="#ffffff" stroke-width="1" stroke-linecap="square"/>
    <!-- Left -->
    <line x1="2" y1="16" x2="14" y2="16" stroke="#ffffff" stroke-width="1" stroke-linecap="square"/>
    <!-- Right -->
    <line x1="18" y1="16" x2="30" y2="16" stroke="#ffffff" stroke-width="1" stroke-linecap="square"/>
  </g>

  <circle cx="16" cy="16" r="14" fill="none" stroke="#ffffff" stroke-width="1" />


  <!-- Weight marking (on plate surface, not hub) -->
  <text
    x="5"
    y="13"
    font-size="3"
    text-anchor="middle"
    fill="#e0e0e0"
    font-family="Arial, sans-serif"
    font-weight="bold"
  >
    20
  </text>
</svg>
